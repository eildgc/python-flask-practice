<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estado de cuenta</title>
    <link
      href="{{ url_for('static', filename='css/output.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="w-screen flex flex-col items-center pt-20 gap-4">
      <div
        class="bg-slate-700 flex flex-col items-center w-5/6 md:w-1/3 gap-2 rounded-t-xl"
      >
        <h1
          class="bg-slate-900 rounded-t-xl font-bold mx-auto text-center px-4 py-3"
        >
          Estado de cuenta
        </h1>

        <ul>
          {% for transaction in transactions %}
          <li>{{ transaction }}</li>
          {% endfor %}
        </ul>
      </div>
      <a href="{{url_for('index')}}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-l">Volver al menú principal</a>
    </div>
  </body>
</html>
