<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depositar dinero</title>
    <link
      href="{{ url_for('static', filename='css/output.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="w-screen flex flex-col items-center pt-20 gap-4">
      <div
        class="bg-slate-700 flex flex-col items-center w-5/6 md:w-1/3 gap-2 rounded-t-xl"
      >
        <h1
          class="bg-slate-900 rounded-t-xl font-bold mx-auto text-center px-4 py-3 w-full"
        >
          Depositar dinero en la cuenta
        </h1>
        <form
          method="POST"
          action="{{url_for('deposit')}}"
          class="px-4 py-5 w-full relative flex flex-col justify-between gap-2"
        >
          <label for="account">Selecciona nombre de la cuenta</label>
          <select name="account" id="account" class="text-black p-2 rounded-lg">
            {% for account in accounts %}
            <option value="{{ account }}">{{ account }}</option>
            {% endfor %}
          </select>
          <br />
          <label for="amount">Cantidad a depositar</label>
          <input
            class="text-black p-2 rounded-lg"
            type="number"
            step="0.01"
            name="amount"
            id="amount"
            required
          />

          <button
            class="bg-white hover:bg-gray-100 text-gray-800 font-semibold py-2 px-4 border border-gray-400 rounded-lg shadow"
            type="submit"
          >
            Depositar
          </button>
        </form>
      </div>
      <a
        href="{{url_for('index')}}"
        class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-l"
        >Volver al menú principal</a
      >
    </div>
  </body>
</html>
