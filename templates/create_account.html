<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta</title>
    <link
      href="{{ url_for('static', filename='css/output.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="w-screen flex flex-col items-center pt-20 gap-4">
      <div
        class="bg-slate-700 flex flex-col items-center w-5/6 md:w-1/3 gap-2 rounded-t-xl"
      >
        <h1
          class="bg-slate-900 rounded-t-xl font-bold mx-auto text-center px-4 py-3 w-full"
        >
          Crear cuenta
        </h1>
        <form
          method="POST"
          action="{{url_for('create_account')}}"
          class="px-4 py-5 w-full relative flex flex-col justify-between gap-2"
        >
          <label for="name">Nombre del dueño de la cuenta</label>
          <input
            class="text-black p-2 rounded-lg"
            type="text"
            name="name"
            id="name"
            required
          />
          <br />
          <label for="initial_balance">Saldo inicial</label>
          <input
            class="text-black p-2 rounded-lg"
            type="number"
            step="0.01"
            name="initial_balance"
            id="initial_balance"
          />
          <br />
          <button
            class="bg-white hover:bg-gray-100 text-gray-800 font-semibold py-2 px-4 border border-gray-400 rounded-lg shadow"
            type="submit"
          >
            Crear cuenta
          </button>
        </form>
      </div>
      <a href="{{url_for('index')}}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-l">Volver al menú principal</a>
    </div>
  </body>
</html>
